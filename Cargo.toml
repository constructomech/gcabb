[workspace]
members = [
    "apps/desktop",
    "apps/release-tool",
    "apps/sdk-probe",
    "crates/app-model",
    "crates/copilot-provider",
    "crates/diagnostics",
    "crates/git-service",
    "crates/gpui-shared-string",
    "crates/gpui-util",
    "crates/session-orchestrator",
    "crates/session-manager",
    "crates/storage",
    "crates/test-harness",
    "crates/updater",
    "crates/ui-components",
    "crates/ztracing-compat",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
version = "0.1.0-rc.11"

[workspace.dependencies]
anyhow = "1.0.100"
app-model = { path = "crates/app-model" }
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.5.54", features = ["derive"] }
copilot-provider = { path = "crates/copilot-provider" }
diagnostics = { path = "crates/diagnostics" }
dirs = "5.0.1"
git-service = { path = "crates/git-service" }
github-copilot-sdk = "=1.0.9"
gpui = { git = "https://github.com/zed-industries/zed", rev = "027cf0def75e5c027504f402a6a6c0dcac11f178", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "027cf0def75e5c027504f402a6a6c0dcac11f178", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
session-manager = { path = "crates/session-manager" }
session-orchestrator = { path = "crates/session-orchestrator" }
storage = { path = "crates/storage" }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.12.0"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
ui-components = { path = "crates/ui-components" }
updater = { path = "crates/updater" }

[patch."https://github.com/zed-industries/zed"]
gpui_shared_string = { path = "crates/gpui-shared-string" }
gpui_util = { path = "crates/gpui-util" }
ztracing = { path = "crates/ztracing-compat" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
