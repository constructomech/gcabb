# cargo-about does not accept SPDX exceptions as policy entries. Treating this
# crate as Apache-2.0 is conservative; its complete Apache-2.0 WITH
# LLVM-exception text is still reproduced from the verified distributed file.
[ar_archive_writer.clarify]
license = "Apache-2.0"

[[ar_archive_writer.clarify.files]]
path = "LICENSE.txt"
checksum = "f72b120d1385408e9e380acc020756eb6ba1b461d66c328ea67327ba08d7dcfd"
